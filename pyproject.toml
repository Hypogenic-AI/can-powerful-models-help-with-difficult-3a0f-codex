[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.14.0",
  "httpx>=0.28.1",
  "matplotlib>=3.10.9",
  "numpy>=2.2.6",
  "openai>=3.3.1",
  "pandas>=2.3.3",
  "pypdf>=6.16.1",
  "scipy>=1.15.3",
  "seaborn>=0.13.2",
  "sentencepiece>=0.2.2",
  "statsmodels>=0.14.6",
  "torch>=2.13.0",
  "transformers>=5.15.1",
  "ziglang>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_workspace"]
